services:
  postgresql-dev:
    container_name: postgresql-dev
    image: postgres:16
    restart: unless-stopped
    ports:
      - "15432:5432/tcp"
    environment:
      - POSTGRES_DB=db-dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./postgresql_volume:/var/lib/postgresql/data:rw,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db-dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - postgres

  postgresql-test-e2e:
    container_name: postgresql-test-e2e
    image: postgres:16
    restart: unless-stopped
    ports:
      - "25432:5432/tcp"
    environment:
      - POSTGRES_DB=db-test-e2e
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nestjs-ddd-devops-app:latest
    container_name: nestjs-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=postgresql-dev
      - DATABASE_PORT=5432
    depends_on:
      postgresql-dev:
        condition: service_healthy
    networks:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - postgres

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - postgres

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - postgres

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - postgres

volumes:
  postgresql_volume:

networks:
  postgres:
    driver: bridge
